name: Crosspost watch

# Vizard cannot tell us a scheduled post failed — it has no status/list endpoint
# (probed 2026-08-18: publish-record / publish-list / publish-status / scheduled
# all 404). So we ask the platforms themselves whether the post actually exists,
# and shout on Telegram when it does not.
#
# Runs twice daily: once after the morning LinkedIn slot, once late evening so
# the evening X/Facebook slots have landed. Silent when everything is fine.

on:
  schedule:
    - cron: '30 6 * * *'    # 12:00 IST — catches the 08:15 LinkedIn slot
    - cron: '30 17 * * *'   # 23:00 IST — catches the evening IG / X / FB slots
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print instead of sending Telegram'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write   # the failure step opens/comments a tracking issue

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check scheduled crossposts
        env:
          VIZARD_API_KEY: ${{ secrets.VIZARD_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 tools/crosspost_watch.py --dry-run
          else
            python3 tools/crosspost_watch.py
          fi

      - name: Persist which posts were already confirmed / alerted
        run: |
          if [ -n "$(git status --porcelain crosspost_state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add crosspost_state.json
            git commit -m "crosspost watch state [skip ci]"
            git pull --rebase -q origin main || true
            git push
          fi

      # Added 05-Sep-2026. This workflow was created 18-Aug, AFTER the alerting
      # sweep that gave daily_short/ig_carousel/social_watch an if: failure()
      # step — so it inherited none. It then crash-looped for 12 days across 22
      # runs on one bad ledger date and nobody was told. A watcher that can die
      # silently is not a watcher.
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::❌ Crosspost watch FAILED: ${RUN_URL}"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ALERT_CHAT_ID" ]; then
            curl -s -m 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
              --data-urlencode "text=⚠️ Crosspost watch FAILED — $(date -u +'%d %b %Y %H:%M UTC'). Scheduled crossposts are NOT being verified. Logs: ${RUN_URL}" \
              -o /dev/null || true
          fi
          gh label create bot-failure --color b60205 --description "daily_short pipeline failure" 2>/dev/null || true
          EXISTING=$(gh issue list --label "bot-failure" --state open --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Crosspost watch failed at $(date -u +'%H:%M UTC %d %b').

          **Run:** ${RUN_URL}" || true
          else
            gh issue create --title "⚠️ Crosspost watch failed — $(date -u +'%d %b %Y')" \
              --body "Scheduled crossposts are not being verified.

          **Run:** ${RUN_URL}" --label "bot-failure" || true
          fi
