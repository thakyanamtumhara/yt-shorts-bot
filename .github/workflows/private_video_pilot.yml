name: Private video pilot

on:
  workflow_dispatch:
    inputs:
      source_key:
        description: Existing owned MP4 under p/ to use as the private test reference
        required: true
        type: string
      recipient_public_key:
        description: Recipient RSA public key, PEM, at least 3072 bits
        required: true
        type: string
      avatar:
        description: Generate one own-face preview using the original recorded voice
        default: false
        type: boolean
      portrait_at:
        description: Portrait frame time in the existing source, seconds
        default: '5'
        type: string
      seconds:
        description: Complete recorded passage length, 3 to 20 seconds
        default: '18.6'
        type: string
      avatar_provider:
        description: Existing account to use for the single private avatar attempt
        default: fal
        type: choice
        options:
          - fal
          - replicate
      skip_music:
        description: Reuse the existing music sample without generating another
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: private-video-pilot
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install boto3 cryptography requests
      - name: Generate encrypted previews
        env:
          PILOT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          PILOT_SOURCE_KEY: ${{ inputs.source_key }}
          PILOT_AVATAR: ${{ inputs.avatar }}
          PILOT_PORTRAIT_AT: ${{ inputs.portrait_at }}
          PILOT_SECONDS: ${{ inputs.seconds }}
          PILOT_AVATAR_PROVIDER: ${{ inputs.avatar_provider }}
          PILOT_SKIP_MUSIC: ${{ inputs.skip_music }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
        run: |
          args=(--source-key "$PILOT_SOURCE_KEY" --portrait-at "$PILOT_PORTRAIT_AT" --seconds "$PILOT_SECONDS" --avatar-provider "$PILOT_AVATAR_PROVIDER")
          if [ "$PILOT_AVATAR" = true ]; then args+=(--avatar); fi
          if [ "$PILOT_SKIP_MUSIC" = true ]; then args+=(--skip-music); fi
          python tools/private_video_pilot.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-video-pilot-encrypted
          path: private-pilot.enc
          if-no-files-found: error
          retention-days: 2
