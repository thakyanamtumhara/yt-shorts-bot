name: Daily YouTube Short
run-name: ${{ (inputs.test_mode || inputs.new_test_mode || inputs.single_veo_test || inputs.test_thumbnail || inputs.hold_only) && 'Daily YouTube Short (test)' || 'Daily YouTube Short' }}

on:
  # GitHub schedule OFF since 3-Oct-2026: every Short waits for Claude's written review (owner: "verify ... give it
  # 100% thumbs up, then only you move forward"). Cloud first since 5-Oct-2026: the Cloudflare Worker
  # cloudflare/daily-short-trigger starts this Mon-Sat 14:30 IST (re-check 14:50) with owner_review on, and the held
  # Short dispatches ai_final_review.yml (Claude Opus 5.5). Ketu's Mac (launchd com.ketu.dailyshortreview, 15:15 IST)
  # is only the backup. Do not restore this GitHub schedule (it starts 3-11 h late and carries no owner_review input):
  # schedule:
  #   # Mon-Sat 09:00 UTC = 2:30 PM IST start; video ready ~3:15 PM IST.
  #   # YouTube publishAt handles the actual 19:00 IST release; the IG container
  #   # is scheduled at the audience's 17:00-21:00 IST evening peak. Sunday is
  #   # intentionally skipped — sunday_recap.yml takes over on Sundays
  #   # (saves ~$7.58/Sun in Veo costs).
  #   - cron: '0 9 * * 1-6'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (skip Veo clips + YouTube upload = free run)'
        required: false
        type: boolean
        default: false
      skip_clips:
        description: 'Skip Veo clips only (use placeholders but still upload to YouTube)'
        required: false
        type: boolean
        default: false
      single_veo_test:
        description: 'Single Veo test (1 real clip + 4 blank — full upload pipeline, saves ~80% Veo cost)'
        required: false
        type: boolean
        default: false
      new_test_mode:
        description: 'New Test Mode (skip Veo clips, YouTube=unlisted, Instagram=no publish, no blog)'
        required: false
        type: boolean
        default: false
      owner_review:
        description: 'Hold the rendered Short for a written review decision before publishing (always on during a campaign with owner_review)'
        required: false
        type: boolean
        default: true
      enable_subtitles:
        description: 'Enable karaoke subtitles (ADD_SUBTITLES=1 — off on cron runs until visually verified)'
        required: false
        type: boolean
        default: false
      test_thumbnail:
        description: 'Test AI thumbnail only (no video/upload — just generates thumbnail and saves as artifact)'
        required: false
        type: boolean
        default: false
      thumbnail_script:
        description: 'Custom script text for thumbnail (Hinglish — the voiceover script)'
        required: false
        type: string
        default: ''
      thumbnail_topic:
        description: 'Custom topic for thumbnail (e.g. "₹49 mein plain t-shirt wholesale")'
        required: false
        type: string
        default: ''
      thumbnail_base_image:
        description: 'Base image URL for thumbnail (paste any public image URL — used as background frame)'
        required: false
        type: string
        default: ''
      skip_preflight:
        description: 'Skip the dependency gate (ship even if the premium voice is down)'
        required: false
        type: boolean
        default: false
      hold_only:
        description: 'Full real run (real clips, voice, checks) that holds the Short at p/review/<run>/ and never publishes'
        required: false
        type: boolean
        default: false
      campaign:
        description: 'Launch campaign lessons: auto (the bank decides by date and weekday), on (any weekday inside the campaign dates) or off (an ordinary AI-video lesson)'
        required: false
        type: choice
        options: [auto, 'on', 'off']
        default: auto
      campaign_fact:
        description: 'Hand run only: use just this one campaign fact id (for example dtf_single_designs); empty = all campaign facts'
        required: false
        type: string
        default: ''
      announcement:
        description: 'Hand run only: an owner-requested announcement id from daily_topic_lessons.json "announcements" (no topic scoring; the script and final reviews still apply)'
        required: false
        type: string
        default: ''

concurrency:
  group: daily-short-generation
  cancel-in-progress: false

jobs:
  create-and-upload:
    permissions:
      contents: write
      issues: write
      actions: write
    runs-on: ubuntu-latest
    # 150 + up to ~15 min for the clip check re-making refused clips (tools/clip_visual_check.py)
    timeout-minutes: 170

    steps:
      # GitHub has started this cron 3-11 hours late since 27-Aug-2026, so the day's Short is
      # sometimes started by hand. A late scheduled run must not publish a second one.
      - name: Skip a duplicate scheduled run
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          done_today=$(gh run list -R "$GITHUB_REPOSITORY" --workflow=daily_short.yml --limit 30 \
            --json databaseId,displayTitle,conclusion,createdAt \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .conclusion == \"success\" and .displayTitle == \"Daily YouTube Short\" and (((.createdAt | fromdateiso8601) + 19800 | strftime(\"%Y-%m-%d\")) == \"$today\"))] | length")
          if [ "${done_today:-0}" -gt 0 ]; then
            echo "::notice::Today's Short already ran successfully; this late scheduled run is cancelled, not repeated."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
            sleep 120
          fi

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        timeout-minutes: 12
        run: |
          # Kill background apt processes that hold the lock on GitHub runners
          sudo killall -9 apt-get apt unattended-upgr 2>/dev/null || true
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a 2>/dev/null || true
          export DEBIAN_FRONTEND=noninteractive
          APT_NET="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo -E apt-get $APT_NET update -qq
          # libraqm* = correct Devanagari shaping (ि-matra reorder, conjuncts)
          # for the thumbnail text renderer; fonts-noto-* for Hindi glyph coverage.
          sudo -E apt-get $APT_NET install -y -qq imagemagick ffmpeg fonts-noto-core fonts-noto-cjk fonts-freefont-ttf libraqm0 libraqm-dev
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: Restore YouTube credentials
        run: |
          mkdir -p /tmp/yt_shorts
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > /tmp/yt_shorts/youtube_token.json
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > /tmp/yt_shorts/client_secret.json

      # Nothing paid runs until this passes. A degraded voice used to ship
      # silently for six days (ElevenLabs Creator -> Starter, 10-13 Aug 2026);
      # now the run stops here instead of burning ~$7.50 of Veo on a bad reel.
      - name: Preflight dependency gate
        if: ${{ github.event.inputs.skip_preflight != 'true' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          VIZARD_API_KEY: ${{ secrets.VIZARD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python -m py_compile daily_short.py health_watch.py social_watch.py
          python health_watch.py --gate

      - name: Run Daily Short Generator
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Voice picked by Ketu in a blind listening test on 2-Oct-2026: Eleven v4 at its
          # natural pace (v4 ignores speed); VOICE_TEMPO 1.0 = no time-stretch.
          # Rollback: eleven_v3 here plus its old settings in daily_short.py (git revert).
          ELEVENLABS_MODEL: eleven_v4
          VOICE_TEMPO: "1.0"
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REDDIT_DRAFTS_PAT: ${{ secrets.REDDIT_DRAFTS_PAT }}
          # IG growth levers (2026-08-15). Trial Reels default Tue+Thu (Python weekday
          # 1,3); collaborators is a comma-separated username list (secret, optional);
          # story reshare defaults ON. The || guards matter: an unset repo var injects
          # empty string, which would otherwise beat the Python-side default.
          IG_TRIAL_WEEKDAYS: ${{ vars.IG_TRIAL_WEEKDAYS || '1,3' }}
          IG_STORY_RESHARE: ${{ vars.IG_STORY_RESHARE || '1' }}
          IG_COLLABORATORS: ${{ secrets.IG_COLLABORATORS }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          SKIP_CLIPS: ${{ github.event.inputs.skip_clips }}
          SINGLE_VEO_TEST: ${{ github.event.inputs.single_veo_test }}
          NEW_TEST_MODE: ${{ github.event.inputs.new_test_mode }}
          # Owner review gate (tools/owner_review.py): the rendered file waits for review_decisions/<run_id>.json
          OWNER_REVIEW: ${{ github.event.inputs.owner_review }}
          GH_TOKEN_REVIEW: ${{ github.token }}
          REVIEW_WAIT_MINUTES: '100'
          HOLD_ONLY: ${{ github.event.inputs.hold_only }}
          DAILY_CAMPAIGN: ${{ github.event.inputs.campaign }}
          DAILY_CAMPAIGN_FACT: ${{ github.event.inputs.campaign_fact }}
          DAILY_ANNOUNCEMENT: ${{ github.event.inputs.announcement }}
          # Karaoke captions LIVE (baseline fix visually verified 2026-07-06; Ketu approved).
          # Kill switch: set to "0".
          ADD_SUBTITLES: "1"
          YOUTUBE_API_KEY_1: ${{ secrets.YOUTUBE_API_KEY_1 }}
          CHANNEL_ID_2: ${{ secrets.CHANNEL_ID_2 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'ap-south-1'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OAUTHLIB_INSECURE_TRANSPORT: '1'
          TEST_THUMBNAIL: ${{ github.event.inputs.test_thumbnail }}
          THUMBNAIL_SCRIPT: ${{ github.event.inputs.thumbnail_script }}
          THUMBNAIL_TOPIC: ${{ github.event.inputs.thumbnail_topic }}
          THUMBNAIL_BASE_IMAGE: ${{ github.event.inputs.thumbnail_base_image }}
        run: |
          if [ "$TEST_THUMBNAIL" = "true" ]; then
            ARGS="--test-thumbnail"
            [ -n "$THUMBNAIL_TOPIC" ] && ARGS="$ARGS --topic \"$THUMBNAIL_TOPIC\""
            [ -n "$THUMBNAIL_SCRIPT" ] && ARGS="$ARGS --script \"$THUMBNAIL_SCRIPT\""
            # Download base image if URL provided
            if [ -n "$THUMBNAIL_BASE_IMAGE" ]; then
              echo "📥 Downloading base image..."
              curl -sL "$THUMBNAIL_BASE_IMAGE" -o /tmp/yt_shorts/base_frame.png
              ARGS="$ARGS --base-image /tmp/yt_shorts/base_frame.png"
            fi
            eval python daily_short.py $ARGS
          else
            python daily_short.py
          fi

      # The gate proves the services were alive before we started; this proves
      # the reel that actually came out is the one we meant to ship.
      - name: Grade the finished reel
        if: ${{ always() && steps.generate.conclusion != 'skipped' && github.event.inputs.test_thumbnail != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # Manual test runs print the grade instead of alerting Ketu.
          TEST_RUN: ${{ github.event.inputs.test_mode == 'true' || github.event.inputs.new_test_mode == 'true' || github.event.inputs.hold_only == 'true' }}
        run: |
          if [ "$TEST_RUN" = "true" ]; then python health_watch.py --postrun --dry-run; else python health_watch.py --postrun; fi

      - name: Save updated tracking files
        if: always()
        run: |
          git config user.name "YT Shorts Bot"
          git config user.email "bot@sale91.com"
          git add topic_history.json || true
          git add lesson_history.json || true
          git add cost_tracker.json || true
          git add engagement_history.json || true
          git add clip_history.json || true
          git add source_channel_insights.json || true
          git add blog_history.json || true
          git add ig_engagement_history.json || true
          git add social_watch_state.json || true
          git add thumbnail_research.json || true
          git add reddit_drafts/ || true
          git add ig_drafts/ || true
          git add voice_vocab.json || true
          git add learned_pronunciations.json || true
          git add urgent_actions.json || true
          git add visual_holds.json || true
          git commit -m "Update tracking files (topic + cost + engagement + clips + source insights + blog + IG + reddit) [skip ci]" || true
          # Parallel sessions push to main while this job runs (verified 15-Aug: run
          # 31858435175 lost the race and the whole job went red). --autostash is
          # load-bearing: the run leaves tracked-but-unlisted files (health/watch state)
          # dirty, plain `pull --rebase` refuses on a dirty tree, `|| true` swallowed
          # that, and the push then rejected non-fast-forward. Retry 3x with backoff.
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} || git rebase --abort || true
            git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push rejected (attempt $i) — remote moved again, retrying in $((i*15))s"
            sleep $((i*15))
          done
          echo "::error::tracking-files push failed after 3 rebase attempts"
          exit 1

      - name: Upload thumbnail test result
        if: ${{ github.event.inputs.test_thumbnail == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-thumbnail
          path: |
            /tmp/yt_shorts/thumbnail_*.png
            /tmp/yt_shorts/test_thumbnail_*.png
            /tmp/yt_shorts/thumb_base_*.png
          retention-days: 7

      - name: Upload test video
        if: ${{ github.event.inputs.test_mode == 'true' || github.event.inputs.new_test_mode == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: |
            /tmp/yt_shorts/SHORT_*.mp4
            /tmp/yt_shorts/thumbnail_*.png
          retention-days: 3

      - name: Save rendered video (backup for every run, not a failure signal)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-backup
          path: |
            /tmp/yt_shorts/SHORT_*.mp4
            /tmp/yt_shorts/thumbnail_*.png
            /tmp/yt_shorts/upload_meta.json
            /tmp/yt_shorts/review_manifest.json
            /tmp/yt_shorts/audio-assessment.json
            /tmp/yt_shorts/visual-assessment.json
            /tmp/yt_shorts/visual-assessment-round1.json
            /tmp/yt_shorts/review_cover.*
            /tmp/yt_shorts/review_normalized_voice.*
            /tmp/yt_shorts/voice_alignment.json
          retention-days: 21
          if-no-files-found: ignore

      - name: Notify on failure
        if: ${{ failure() && github.event.inputs.test_mode != 'true' && github.event.inputs.new_test_mode != 'true' && github.event.inputs.hold_only != 'true' }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::❌ Daily Short pipeline FAILED! Check logs: ${RUN_URL}"
          # 1) Primary alert — ping Ketu on Telegram (GH issues go unwatched).
          # TELEGRAM_ALERT_CHAT_ID only: TELEGRAM_CHANNEL_ID is the PUBLIC Sale91
          # channel and must never receive internal failure notices.
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ALERT_CHAT_ID" ]; then
            curl -s -m 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
              --data-urlencode "text=⚠️ Daily Short pipeline failed — $(TZ=Asia/Kolkata date +'%d %b %Y %H:%M IST'). Check the failed step and any completed uploads before retrying. Logs: ${RUN_URL}" \
              -o /tmp/daily-alert.json
            python -c 'import json; r=json.load(open("/tmp/daily-alert.json")); assert r.get("ok") is True, "Telegram did not confirm delivery"; print("Private failure alert delivered:", r["result"]["message_id"])'
          fi
          # 2) Tracking issue (ensure label exists first, else create fails silently)
          gh label create bot-failure --color b60205 --description "daily_short pipeline failure" 2>/dev/null || true
          EXISTING=$(gh issue list --label "bot-failure" --state open --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            echo "Open issue #$EXISTING already exists — adding comment instead"
            gh issue comment "$EXISTING" --body "Another failure at $(date -u +'%H:%M UTC %d %b').
          **Run:** ${RUN_URL}" || true
          else
            gh issue create \
              --title "⚠️ Daily Short failed — $(date -u +'%d %b %Y')" \
              --body "Pipeline failed at $(date -u +'%H:%M UTC').

          **Run:** ${RUN_URL}
          **Trigger:** ${{ github.event_name }}

          Check logs for: Anthropic credit balance empty, Veo API errors, TTS failures, YouTube upload issues, or cost limit exceeded." \
              --label "bot-failure" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
