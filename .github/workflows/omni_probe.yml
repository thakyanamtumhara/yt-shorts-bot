name: Omni video probe
run-name: "Omni video probe"

# One short Gemini Omni Flash test clip (about $0.40): proves the GOOGLE_API_KEY can make the daily Short's clips
# (tools/omni_video.py) after Google shut Veo 3.1 down on 22-Oct-2026. Publishes nothing; the clip is an artifact.

on:
  workflow_dispatch:
    inputs:
      through_daily_short:
        description: 'Also make two 8 s clips through daily_short.py itself (main-loop helper + clip-check re-make, about $1.60)'
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        timeout-minutes: 12
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT_NET="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo -E apt-get $APT_NET update -qq
          sudo -E apt-get $APT_NET install -y -qq ffmpeg
          pip install -q requests

      - name: Make one test clip
        run: python -m tools.omni_video --probe omni_probe.mp4

      - name: Install the daily Short's packages
        if: ${{ inputs.through_daily_short }}
        run: pip install -q -r requirements.txt

      - name: Two clips through daily_short.py
        if: ${{ inputs.through_daily_short }}
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          python - <<'PY'
          import json, os, shutil
          import daily_short as d
          os.makedirs(d.WORK_DIR, exist_ok=True)
          main = f"{d.WORK_DIR}/main_clip.mp4"
          r, kind = d.omni_clip_attempts("A neatly folded plain white cotton T-shirt on a light wooden table in soft daylight; the camera slowly pushes in.", main, label="Main-loop clip")
          print("MAIN", kind, json.dumps({k: r[k] for k in ("seconds", "bytes", "cost")} if r else None))
          print("VALID", d.validate_video_file(main))
          remade = f"{d.WORK_DIR}/remade_clip.mp4"
          made = d.veo_clip_once(None, "A neat stack of plain navy blue T-shirts on a warehouse shelf; the camera slides slowly sideways.", remade)
          print("REMADE", json.dumps(made))
          c = d.CostTracker()
          if r:
              c.track_omni(r["seconds"], 1)
          if made and made["provider"] == "omni":
              c.track_omni(made["seconds"], 1)
          print("COST", json.dumps(c.costs))
          for f in (main, remade):
              if os.path.exists(f):
                  shutil.copy(f, os.path.basename(f))
          raise SystemExit(0 if r and made else 1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omni-probe
          path: |
            omni_probe.mp4
            main_clip.mp4
            remade_clip.mp4
          if-no-files-found: ignore
          retention-days: 7
