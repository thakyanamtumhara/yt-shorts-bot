name: Auto Content Recheck

on:
  schedule:
    - cron: '7 11,15 * * *'
  workflow_run:
    workflows:
      - Daily YouTube Short
      - IG Carousel Post (next-day lunch auto-publish)
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check without sending the private Telegram summary'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-content-recheck
  cancel-in-progress: false

jobs:
  recheck:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only verification dependencies
        run: pip install -q requests google-auth google-api-python-client
      - name: Check monitor regressions
        run: python -m unittest discover -s tests -p 'test_auto_content_recheck.py'
      - name: Verify today's outputs and send private result
        id: recheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          RECHECK_TRIGGER_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            python tools/auto_content_recheck.py --dry-run
          else
            python tools/auto_content_recheck.py
          fi
      - name: Notify if the recheck itself could not report
        if: failure() && inputs.dry_run != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RECHECK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from social_watch import _tg_direct
          report = Path('auto-content-recheck/report.json')
          try:
              delivered = json.loads(report.read_text()).get('notification_delivered') is True
          except Exception:
              delivered = False
          if not delivered:
              ok, _ = _tg_direct('Auto-content recheck could not finish',
                                 'The scheduled check did not confirm all outputs. Review: ' + os.environ['RECHECK_RUN_URL'])
              print(json.dumps({'fallback_notification_delivered': ok}))
              if not ok:
                  raise SystemExit(1)
          PY
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-content-recheck
          path: auto-content-recheck/*.json
          retention-days: 14
          if-no-files-found: warn
