name: Audit Finished Short Output

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed daily_short.yml main run ID in this repository'
        required: true
        type: string
        default: '35884612564'
      visual_only:
        description: 'Read-only visual replay only; do not repeat native audio assessment'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only audit dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q requests google-auth google-api-python-client
      - name: Verify exact artifact, spoken output, final visuals and platform readbacks
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          VISUAL_ONLY: ${{ inputs.visual_only }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
        run: |
          if [ "$VISUAL_ONLY" = "true" ]; then
            python tools/audit_visual_output.py --run-id "$SOURCE_RUN_ID"
          else
            python tools/audit_short_output.py --run-id "$SOURCE_RUN_ID"
          fi
      - name: Retain safe verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finished-short-audit
          path: audit-short-report/*.json
          retention-days: 7
          if-no-files-found: warn
