name: Sunday Recap (Main Channel)

# Sunday 13:30 UTC = 7:00 PM IST. Picks up the user's Saturday upload on
# their main 40K-subs channel (CHANNEL_ID_2) and generates a blog post +
# Reddit draft from it. Replaces Sunday's autonomous Veo daily-bot run
# (daily_short.yml cron is `0 9 * * 1-6` — Mon-Sat only, no Sunday).
#
# Why Sunday evening (not morning):
#   The user uploads original content Saturday evening (sometimes as late as
#   10 PM IST). Sunday 7 PM IST gives 21+ hours buffer for the video to be
#   available + indexed in YouTube Data API.

on:
  schedule:
    - cron: '30 13 * * 0'   # Sunday 13:30 UTC = 19:00 IST
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Validate reviewed drafts and S3 preconditions without publishing or running the standard recap'
        type: boolean
        default: false

concurrency:
  group: sunday-article-publish
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Use built-in GITHUB_TOKEN (matches daily_short.yml and ig_carousel.yml).
          # GH_PAT fails with 403 on push from workflow runtime — same issue
          # that broke ig_carousel.yml on May 15-16 until fixed.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install reviewed article dependencies
        run: pip install -q 'boto3>=1.40.20' cryptography

      - name: Publish due reviewed website article
        id: reviewed
        env:
          REVIEWED_ARTICLE_KEY: ${{ secrets.REVIEWED_ARTICLE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'ap-south-1'
          YOUTUBE_API_KEY_1: ${{ secrets.YOUTUBE_API_KEY_1 }}
        run: |
          if [ '${{ inputs.verify_only }}' = 'true' ]; then
            python3 tools/publish_reviewed_article.py --verify-only
          else
            python3 tools/publish_reviewed_article.py --execute
          fi

      - name: Install system deps
        if: steps.reviewed.outputs.handled_today != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          # yt-dlp now needs a JS runtime to extract YouTube audio; without it
          # the Sunday Whisper speech-capture path fails and the corpus falls
          # back to the video description (marketing copy, not his speech).
          curl -fsSL https://deno.land/install.sh | sh -s -- -y || true
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install Python packages
        if: steps.reviewed.outputs.handled_today != 'true'
        run: pip install -q -r requirements.txt

      - name: Run Sunday recap
        if: steps.reviewed.outputs.handled_today != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'ap-south-1'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          YOUTUBE_API_KEY_1: ${{ secrets.YOUTUBE_API_KEY_1 }}
          CHANNEL_ID_2: ${{ secrets.CHANNEL_ID_2 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REDDIT_DRAFTS_PAT: ${{ secrets.REDDIT_DRAFTS_PAT }}
        run: python3 daily_short.py --mode=sunday-recap

      - name: Save updated tracking files
        if: always() && inputs.verify_only != true
        run: |
          git config user.name "YT Shorts Bot"
          git config user.email "bot@sale91.com"
          git add blog_history.json || true
          git add reddit_drafts/ || true
          git add ig_drafts/ || true
          git add voice_corpus/ || true
          git add phase_status.json || true
          git add voice_vocab.json || true
          git add learned_pronunciations.json || true
          git commit -m "Sunday recap [skip ci]" || true
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
