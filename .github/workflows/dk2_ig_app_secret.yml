name: dk2 IG webhook app secret

# Injects FB_APP_SECRET into the digital-ketu2 Railway service as IG_APP_SECRET, which turns on
# X-Hub-Signature-256 verification on POST /ig/webhook (dk2 fails OPEN until this var exists).
# The secret is validated against Graph API before injection. Its value is never printed.

on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate app secret, then inject into Railway
        env:
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          python3 - << 'PY'
          import json, os, sys, urllib.request, urllib.parse

          app_id = os.environ["FB_APP_ID"].strip()
          app_secret = os.environ["FB_APP_SECRET"].strip()
          rw = os.environ["RAILWAY_TOKEN"].strip()
          assert app_secret, "FB_APP_SECRET is empty"

          # 1. Prove the secret is the RIGHT one: an app access token is literally "<id>|<secret>",
          #    so Graph rejects it outright if the secret is stale. Nothing is printed but the verdict.
          q = urllib.parse.urlencode({"input_token": f"{app_id}|{app_secret}",
                                      "access_token": f"{app_id}|{app_secret}"})
          try:
              with urllib.request.urlopen(
                  f"https://graph.facebook.com/v21.0/debug_token?{q}", timeout=20) as r:
                  d = json.load(r).get("data", {})
          except urllib.error.HTTPError as e:
              print("❌ app secret rejected by Graph API — it is wrong or rotated"); sys.exit(1)
          if not d.get("is_valid") or str(d.get("app_id")) != app_id:
              print(f"❌ app secret did not validate: {str(d)[:200]}"); sys.exit(1)
          print(f"✅ app secret validated against Graph (app_id={d.get('app_id')}, type={d.get('type')})")

          # 2. Inject into digital-ketu2 production env
          def railway(query, variables):
              req = urllib.request.Request(
                  "https://backboard.railway.com/graphql/v2",
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  headers={"Authorization": f"Bearer {rw}", "Content-Type": "application/json",
                           "User-Agent": "curl/8.5.0"},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          MUT = """mutation($input: VariableUpsertInput!) { variableUpsert(input: $input) }"""
          # dk2 (digital-ketu2) — /ig/webhook, enforces immediately once the var exists.
          # wwbun (bun-webb) — /api/webhook/instagram, the URL Meta ACTUALLY delivers to. It was
          # falling back to FACEBOOK_APP_SECRET, which belongs to app 1261997992439692 (the
          # WhatsApp app, no instagram subscription), hence the live "[IG Webhook] SIG MISMATCH".
          # Instagram events are signed by app 805447515148234. Setting IG_APP_SECRET fixes the
          # comparison; wwbun stays in MONITOR mode until IG_WEBHOOK_REQUIRE_SIGNATURE=true.
          # Never touch FACEBOOK_APP_SECRET / WHATSAPP_APP_SECRET — the WhatsApp webhook reads those.
          TARGETS = [
              ("digital-ketu2", "1532ef75-5566-43a8-b3f9-a104b693f28d",
               "d6a67225-aac8-485d-b01c-a24a50fc0f31", "2f0995b2-0c6a-4aee-a5c3-8af7f9309300"),
              ("wwbun/bun-webb", "7bef545a-9d11-43bd-a565-7caba458e670",
               "13d25ac8-a954-4cfe-a8f3-09051d738e4b", "fb07d529-759d-40fa-99d1-d03d4e5d1dad"),
          ]
          for name, pid, eid, sid in TARGETS:
              resp = railway(MUT, {"input": {"projectId": pid, "environmentId": eid,
                                             "serviceId": sid, "name": "IG_APP_SECRET",
                                             "value": app_secret}})
              if not resp.get("data", {}).get("variableUpsert"):
                  print(f"❌ railway upsert failed for {name}: {str(resp)[:300]}"); sys.exit(1)
              print(f"✅ IG_APP_SECRET set on {name}")
          print("✅ done — dk2 enforces now; wwbun should start logging SIG OK (still monitor mode)")
          PY
