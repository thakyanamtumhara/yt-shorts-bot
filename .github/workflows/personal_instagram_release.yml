name: Approved personal Instagram release
on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight is read only; publish_due requires every release dependency
        type: choice
        options: [preflight, publish_due]
        default: preflight
concurrency:
  group: approved-personal-instagram-release
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
jobs:
  personal-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          pip install requests Pillow cryptography 'boto3>=1.36.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Check dependencies and release exact approved video when due
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          REVIEWED_AI_GRAPH_VERSION: v26.0
          YOUTUBE_API_KEY_1: ${{ secrets.YOUTUBE_API_KEY_1 }}
          PERSONAL_INSTAGRAM_RELEASE_KEY: ${{ secrets.PERSONAL_INSTAGRAM_RELEASE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          mode="${REQUESTED_MODE:-preflight}"
          if [ "$EVENT_NAME" = schedule ]; then mode=publish_due; fi
          if [ "$mode" = publish_due ]; then
            test "$GITHUB_REF" = refs/heads/main
            python3 -m tools.personal_instagram_release --execute
          else
            python3 -m tools.personal_instagram_release
          fi
      - name: Preserve identifier-only recovery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-instagram-state-${{ github.run_id }}
          path: personal_instagram_releases/state/*.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Notify through a persistent private-detail-free repository issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Approved personal Instagram release needs attention';
            const {owner, repo} = context.repo;
            const rows = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', per_page: 100});
            if (!rows.some(row => row.title === title)) {
              await github.rest.issues.create({owner, repo, title, body: `A release check failed. The approved clip must remain held until its source, full-video/profile-link dependencies, and saved Graph request state are checked. Do not retry an ambiguous create/publish request. Inspect [the workflow run](https://github.com/${owner}/${repo}/actions/runs/${context.runId}). No private content is included here.`});
            }
