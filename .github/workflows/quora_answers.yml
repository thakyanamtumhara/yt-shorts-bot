name: Quora answers
run-name: "Quora answers (${{ github.event.schedule == '30 4 * * 2' && 'Monday check' || github.event_name == 'schedule' && 'weekly' || inputs.action }})"

# Ketu 18-Oct-2026: "Whatever is the safest, you can keep doing it from your side." Quora's terms give no right to
# post with automated tools, so this only drafts: Claude Opus finds real questions through web search and writes
# disclosed, price-free answers (quora_answers.py). A person pastes them: every Monday 10:00 IST the new answers go
# on one fixed posting page (bulkplaintshirt.com/p/review/qa/<QA_PAGE_KEY>.html) and Ketu gets its link on Telegram.
# Tuesday 10:00 IST only checks that Monday's batch went out, and tells him on Telegram if it did not.

on:
  schedule:
    - cron: '30 4 * * 1'
    - cron: '30 4 * * 2'
  workflow_dispatch:
    inputs:
      action:
        description: 'dry-run = print only; send = write a batch now; page = rebuild the page and send the link; resend = a saved batch to Telegram; check = is this week in the log'
        type: choice
        options: [dry-run, send, page, resend, check]
        default: dry-run
      date:
        description: 'resend only: the batch date, e.g. 2026-10-18'
        type: string
        default: ''

concurrency:
  group: quora-answers
  cancel-in-progress: false

jobs:
  answers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
      QA_PAGE_KEY: ${{ secrets.QA_PAGE_KEY }}
      QA_PAGE_URL: https://www.bulkplaintshirt.com/p/review/qa/${{ secrets.QA_PAGE_KEY }}.html
      MODE: ${{ github.event.schedule == '30 4 * * 2' && 'check' || github.event_name == 'schedule' && 'send' || inputs.action }}
      DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the answer rules
        run: python3 -m unittest tests/test_quora_answers.py -v
      - name: Write this week's answers
        if: env.MODE == 'send' || env.MODE == 'dry-run'
        run: python3 quora_answers.py --mode "$MODE"
      - name: Save which questions were sent
        if: env.MODE == 'send'
        run: |
          git config user.name "Quora Answers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add quora_answers/log.json
          git diff --cached --quiet && exit 0
          git commit -m "Quora answers: log this week's questions [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
      - name: Publish the posting page
        if: env.MODE == 'send' || env.MODE == 'page'
        run: |
          [ -n "$QA_PAGE_KEY" ] || { echo "QA_PAGE_KEY missing"; exit 1; }
          python3 quora_answers.py --mode page --out "$RUNNER_TEMP/qa.html"
          aws s3 cp "$RUNNER_TEMP/qa.html" "s3://bulkplaintshirt.com/p/review/qa/$QA_PAGE_KEY.html" \
            --content-type "text/html; charset=utf-8" --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation --distribution-id E21QLU9SBUBY7Z \
            --paths "/p/review/qa/$QA_PAGE_KEY.html" --query 'Invalidation.Id' --output text
      - name: Send Ketu the link
        if: env.MODE == 'send' || env.MODE == 'page'
        run: python3 quora_answers.py --mode tell
      - name: Send a saved batch to Telegram again
        if: env.MODE == 'resend'
        run: python3 quora_answers.py --mode resend --date "$DATE"
      - name: Check that Monday's batch went out
        if: env.MODE == 'check'
        run: python3 quora_answers.py --mode check
      - name: Tell Ketu if it failed
        if: failure() && env.MODE != 'dry-run'
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ALERT_CHAT_ID" ] || exit 0
          curl -s -m 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode "text=Quora answers did not go out this week: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
