name: Audio Sample (TTS verification)

# Generates an audio sample using the repository's daily voice configuration
# and full text preprocessor, including the committed learned aliases.
# Whisper provides a content transcript, not a pronunciation pass. Review audio.

on:
  workflow_dispatch:
    inputs:
      sample_text:
        description: 'Hinglish phrase to test'
        required: false
        default: 'Ye combed cotton hai, laambe samay tak chalega. Aankhein band karke feel karo. 15 rupiya bachke, feel hi badal jaata hai.'
      model:
        description: 'Optional model override; blank uses the daily workflow model'
        required: false
        default: ''
      voice_tempo:
        description: 'Optional tempo override; blank uses the daily workflow tempo'
        required: false
        default: ''

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generate + transcribe sample
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          INPUT_SAMPLE_TEXT: ${{ inputs.sample_text }}
          INPUT_MODEL: ${{ inputs.model }}
          VOICE_TEMPO: ${{ inputs.voice_tempo }}
        run: |
          set -e
          pip install -q elevenlabs requests openai-whisper
          python3 - << 'PY'
          import json, os, subprocess

          from tools.voice_runtime import load_normalize_for_tts, production_voice_config
          normalize_for_tts = load_normalize_for_tts()
          config = production_voice_config()
          VOICE_ID = config['voice_id']
          SETTINGS = config['voice_settings']
          model = os.environ.get("INPUT_MODEL", "").strip() or config['model_id']

          text = os.environ.get("INPUT_SAMPLE_TEXT") or ""
          if not text or text == "None":
              text = "Ye combed cotton hai, laambe samay tak chalega. Aankhein band karke feel karo."

          processed = normalize_for_tts(text)
          print("=" * 70)
          print("ORIGINAL:\n" + text)
          print("\nAFTER PREPROCESSOR (what ElevenLabs sees):\n" + processed)
          print(f"\nMODEL: {model}")
          print("=" * 70)

          # Exact production call path (elevenlabs SDK, same as daily_short.py)
          from elevenlabs import ElevenLabs
          client = ElevenLabs(api_key=os.environ["ELEVENLABS_API_KEY"])
          audio_iter = client.text_to_speech.convert(
              voice_id=VOICE_ID, model_id=model, text=processed,
              voice_settings=SETTINGS,
          )
          with open("sample_raw.mp3", "wb") as f:
              for chunk in audio_iter:
                  f.write(chunk)
          print(f"✅ Generated sample_raw.mp3 ({os.path.getsize('sample_raw.mp3')} bytes)")

          # Production post-process: VOICE_TEMPO (1.0 = none) + loudnorm
          try:
              tempo = max(0.5, min(2.0, float(os.environ.get("VOICE_TEMPO", "").strip() or config["voice_tempo"])))
          except ValueError:
              raise ValueError("Invalid requested QA tempo")
          af = "loudnorm=I=-14:TP=-1.5:LRA=11"
          if abs(tempo - 1.0) > 0.001:
              af = f"atempo={tempo:.3f}," + af
          subprocess.run(["ffmpeg", "-i", "sample_raw.mp3", "-af", af,
                          "-y", "sample_audio.mp3"], check=True, capture_output=True)
          print(f"🔊 tempo={tempo} + loudnorm applied")

          # ASR records content; correct text does not prove correct pronunciation.
          import whisper
          wt = whisper.load_model("small").transcribe("sample_audio.mp3", language="hi")
          transcript = (wt.get("text") or "").strip()
          print("\n" + "=" * 70)
          print("WHISPER HEARD:\n" + transcript)
          print("=" * 70)

          config['selected_model_id'] = model
          config['selected_voice_tempo'] = tempo
          config['matches_daily_model_and_tempo'] = model == config['model_id'] and tempo == config['voice_tempo']
          config['qa_scope'] = 'ASR content transcript only; actual-audio pronunciation review still required'
          with open("sample_voice_config.json", "w") as f:
              json.dump(config, f, indent=2)
          with open("sample_meta.txt", "w") as f:
              f.write(f"ORIGINAL:\n{text}\n\nPREPROCESSED:\n{processed}\n\n"
                      f"MODEL: {model}\nTEMPO: {tempo}\nPRONUNCIATION: actual-audio review required\n\nWHISPER HEARD:\n{transcript}\n")
          PY

      - name: Upload audio sample artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-sample
          path: |
            sample_audio.mp3
            sample_meta.txt
            sample_voice_config.json
          retention-days: 7
