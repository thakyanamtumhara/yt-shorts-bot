name: Phone agent rates

# Keeps the rate list inside the phone voice agent's prompt equal to the website (tools/phone_agent_rates.py).
# Stock is not here: the agent asks the live stock tool on every call. Silent when nothing changed.
# 02:15 UTC = 07:45 IST and 08:15 UTC = 13:45 IST; GitHub timers can skip, a day needs one run.

on:
  schedule:
    - cron: '15 2 * * *'
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only say whether the rates differ'
        required: false
        type: boolean
        default: false
      force:
        description: 'Write the rate list even if nothing changed'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: phone-agent-rates
  cancel-in-progress: false

jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh the phone agent's rates
        timeout-minutes: 6
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: python3 tools/phone_agent_rates.py
      - name: Notify on failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ALERT_CHAT_ID" ]; then
            curl -s -m 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
              --data-urlencode "text=⚠️ Phone AI rate update failed ($(date -u +'%d %b %Y')). The phone agent may quote old rates. Tell an AI session to look. Logs: ${RUN_URL}" \
              -o /dev/null || true
          fi
