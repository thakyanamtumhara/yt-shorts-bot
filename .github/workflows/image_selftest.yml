name: Blog Image Self-Test

# Generates 3 images back-to-back through the real _generate_image_replicate()
# and reports how many survive. Manual only, ~$0.09 a run, uploads nothing.
#
# Why this exists: health_watch only pings /v1/account, which stays green even
# when image generation is broken. The actual failure mode is a BURST limit —
# below $5 of Replicate credit the account is cut to one prediction at a time,
# so the hero succeeds and img1/img2 get an instant 429. That is invisible to a
# single-call probe and it silently shipped hero-only posts from 27-Jul to
# 15-Aug-2026. Three sequential calls is the only honest test.

on:
  # Weekly, 03:00 UTC Monday = 08:30 IST — ahead of the 09:00 UTC daily_short so
  # a dead image provider is known BEFORE the week's first blog day. ~$0.09/run.
  # Added 05-Sep-2026: manual-only meant nothing watched image health, and
  # health_watch's Replicate check is a bare /v1/account ping that stayed green
  # for three weeks while every post shipped hero-only.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write   # the failure step opens/comments a tracking issue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Generate 3 images back-to-back
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          python3 - <<'PY'
          import time, traceback
          from daily_short import _generate_image_replicate

          PROMPTS = [
              ("hero.webp", "16:9", "Plain cotton t-shirts stacked in an Indian warehouse, bright lighting"),
              ("img1.webp", "4:3", "Close-up of cotton fabric texture showing GSM weave, soft light"),
              ("img2.webp", "4:3", "Indian textile factory floor with folded blank t-shirts"),
          ]
          ok = 0
          t0 = time.time()
          for name, aspect, prompt in PROMPTS:
              started = time.time()
              try:
                  data = _generate_image_replicate(f"{prompt}. professional commercial photography, sharp focus", aspect)
                  size = len(data) if data else 0
                  if data and size > 1000:
                      ok += 1
                      print(f"✅ {name}: {size//1024} KB in {time.time()-started:.1f}s")
                  else:
                      print(f"❌ {name}: returned {size} bytes")
              except Exception as e:
                  throttled = "429" in str(e) or "throttl" in str(e).lower()
                  print(f"❌ {name}: {'THROTTLED (429)' if throttled else 'ERROR'} after "
                        f"{time.time()-started:.1f}s — {str(e)[:180]}")

          print(f"\n📷 RESULT: {ok}/3 images generated in {time.time()-t0:.0f}s total")
          if ok == 3:
              print("✅ Image generation is fully healthy — blog posts will get all 3 images.")
          elif ok == 1:
              print("⚠️ Only the hero survived — this is the burst-limit signature. "
                    "Check the Replicate credit balance is above $5.")
          else:
              print("⚠️ Partial or total failure — read the per-image errors above.")
          raise SystemExit(0 if ok == 3 else 1)
          PY

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::❌ Blog image self-test FAILED — posts will ship with missing images: ${RUN_URL}"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ALERT_CHAT_ID" ]; then
            curl -s -m 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
              --data-urlencode "text=⚠️ Blog image self-test FAILED — $(date -u +'%d %b %Y %H:%M UTC'). Blog posts will ship with missing images. Check Replicate credit (throttles under \$5) and the fal.ai balance. Logs: ${RUN_URL}" \
              -o /dev/null || true
          fi
          gh label create bot-failure --color b60205 --description "daily_short pipeline failure" 2>/dev/null || true
          EXISTING=$(gh issue list --label "bot-failure" --state open --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Blog image self-test failed at $(date -u +'%H:%M UTC %d %b') — posts will ship with missing images.

          **Run:** ${RUN_URL}" || true
          else
            gh issue create --title "⚠️ Blog images failing — $(date -u +'%d %b %Y')" \
              --body "The 3-image self-test did not return 3/3, so blog posts will ship with missing images.

          Check Replicate credit (it throttles to a burst of 1 under \$5) and the fal.ai balance.

          **Run:** ${RUN_URL}" --label "bot-failure" || true
          fi
